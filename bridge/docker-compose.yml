services:
  wg:
    image: linuxserver/wireguard:version-v1.0.20210914
    container_name: wg
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Moscow}
    cap_add:
      - SYS_MODULE
      - NET_ADMIN
    ports:
      - 51820:51820/udp
      - 51820:51820/tcp
      - "${WG_EXPORTER_BIND_ADDRESS:-127.0.0.1}:9586:9586/tcp"
    volumes:
      - ./config:/config
      - ./clients:/clients
      - /lib/modules:/lib/modules
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

  wg-bot:
    image: ghcr.io/tlmonko/wg-proxy/wg-bot:latest
    container_name: wg-bot
    restart: always
    depends_on:
      - wg
    env_file:
      - .env
    volumes:
      - ./config:/config
      - ./clients:/clients
      - ./bot-data:/data
      - ./monitoring/peer-names:/monitoring/peer-names
    network_mode: "service:wg"
    cap_add:
      - NET_ADMIN
    environment:
      - WG_PEER_NAMES_FILE=/monitoring/peer-names/wg0.conf

  wg-exporter:
    image: mindflavor/prometheus-wireguard-exporter:3.6.6
    container_name: wg-exporter
    restart: unless-stopped
    depends_on:
      - wg
    network_mode: "service:wg"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./monitoring/peer-names:/monitoring/peer-names:ro
    command:
      - "-a"
      - "true"
      - "-i"
      - "${WG_INTERFACE:-wg0}"
      - "-n"
      - "/monitoring/peer-names/wg0.conf"
      - "-d"
      - "true"
