server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: proxy VictoriaMetrics through the same origin, then set
  # the data source URL to "/vm" in the UI (no CORS needed at all).
  # Uncomment and point at your VM:
  # location /vm/ {
  #   proxy_pass http://victoriametrics:8428/;
  #   proxy_set_header Host $host;
  # }
}
